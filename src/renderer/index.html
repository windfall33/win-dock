<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="dock-root" class="hidden">
    <div id="dock-bar">
      <div id="dock-items"></div>
    </div>
  </div>

  <div id="tooltip" class="tooltip hidden"></div>
  <div id="preview-panel" class="preview hidden"></div>
  <div id="stack-panel" class="stack-panel hidden"></div>
  <div id="menu-layer" class="hidden"></div>
  <div id="drag-ghost" class="drag-ghost hidden"></div>

  <!-- core 纯函数以 UMD 全局注入（ConfirmArm/ModifierActions/KbdNav/StackSort/Spring），
       先于 module 执行；P3-F1b 后渲染层入口为 ES module dock.js -->
  <script src="../core/confirm-arm.js"></script>
  <script src="../core/modifier-actions.js"></script>
  <script src="../core/kbd-nav.js"></script>
  <script src="../core/stack-sort.js"></script>
  <script src="../core/spring.js"></script>
  <script type="module" src="dock.js"></script>
</body>
</html>
